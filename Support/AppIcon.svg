<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Very dark blue, soft vertical fade only -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131c40"/>
      <stop offset="0.55" stop-color="#0b1230"/>
      <stop offset="1" stop-color="#05081c"/>
    </linearGradient>
    <!-- Whisper of color across the slab -->
    <linearGradient id="tint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a5ac2" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#4a5ac2" stop-opacity="0"/>
      <stop offset="1" stop-color="#1a8fa0" stop-opacity="0.10"/>
    </linearGradient>
    <!-- Curved top sheen -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Frosted glass glyph -->
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.72"/>
      <stop offset="0.5" stop-color="#dcecff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#bcd8ff" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="blur20" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#tint)"/>

    <!-- glass touch: curved top sheen -->
    <path d="M 100 340 Q 512 210 924 330 L 924 100 L 100 100 Z" fill="url(#sheen)"/>

    <!-- >_ as molded glass -->
    <g>
      <!-- soft drop shadows -->
      <path d="M 330 356 L 520 512 L 330 668" fill="none" stroke="#02060f" stroke-width="92"
            stroke-linecap="round" stroke-linejoin="round" opacity="0.4" filter="url(#blur20)"
            transform="translate(10 24)"/>
      <rect x="586" y="622" width="164" height="70" rx="35" fill="#02060f" opacity="0.4"
            filter="url(#blur20)" transform="translate(8 22)"/>

      <!-- chevron -->
      <path d="M 330 356 L 520 512 L 330 668" fill="none" stroke="url(#glass)" stroke-width="86"
            stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 330 350 L 462 458" fill="none" stroke="#ffffff" stroke-width="14"
            stroke-linecap="round" opacity="0.6" filter="url(#soft)"/>

      <!-- underscore -->
      <rect x="586" y="622" width="164" height="70" rx="35" fill="url(#glass)"/>
      <rect x="594" y="628" width="148" height="26" rx="13" fill="#ffffff" opacity="0.5" filter="url(#soft)"/>
    </g>
  </g>

  <!-- Rim light on the squircle edge -->
  <rect x="103" y="103" width="818" height="818" rx="183" fill="none"
        stroke="#ffffff" stroke-opacity="0.18" stroke-width="6"/>
</svg>
